name: 시세 스냅샷 수집

on:
  schedule:
    # 하루 6회 수집 중 5회: KST 07:17/11:17/15:17/19:17/23:17 = UTC 22:17/02:17/06:17/10:17/14:17
    # 심야 회차(KST 02:17)는 daily.yml이 수집+분석+브리핑을 통합 수행한다.
    # 분을 17분으로 둔 이유: 정각은 스케줄러 혼잡으로 드롭·지연이 잦다.
    - cron: "17 2,6,10,14,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 전 품목 실패 시 재시도 백오프(30초·120초)까지 감안한 상한
    timeout-minutes: 35
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 셋업
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests

      - name: 스냅샷 수집
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
        run: python pipeline/collect.py

      - name: 시계열 집계
        run: python pipeline/aggregate.py

      - name: 데이터 커밋 (data/ 경로 한정)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[data] 스냅샷 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            # 다른 회차와 겹치면 push가 밀린다. rebase 후 최대 3회까지 다시 시도한다.
            for attempt in 1 2 3; do
              if git pull --rebase origin master && git push; then
                echo "푸시 성공 (시도 $attempt)"
                exit 0
              fi
              echo "::warning::푸시 실패 ($attempt/3), 10초 후 재시도"
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            echo "::error title=데이터 푸시 실패::rebase 후 3회 재시도했지만 push가 모두 실패했습니다."
            exit 1
          fi
