name: 심야 분석·브리핑

on:
  schedule:
    # KST 02:17 = UTC 17:17. 심야 회차: 수집→탐지→해석→브리핑 통합 실행.
    # 03시가 아니라 02시대인 이유: GitHub 예약 실행이 상시 30~110분 지연돼
    # 목요일 정기점검 시간대와 겹쳤다 (2026-08-27 04:46 실행, 전 품목 503).
    # 분을 17분으로 둔 이유: 정각은 스케줄러 혼잡으로 드롭·지연이 잦다.
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # 전 품목 실패 시 재시도 백오프(30초·120초)까지 감안한 상한
    timeout-minutes: 40
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 셋업
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests anthropic

      - name: 통합 실행 (수집→집계→탐지→해석→브리핑)
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/run_daily.py

      - name: 데이터 커밋 (data/ 경로 한정)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[data] 심야 분석·브리핑 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            # 다른 회차와 겹치면 push가 밀린다. rebase 후 최대 3회까지 다시 시도한다.
            for attempt in 1 2 3; do
              if git pull --rebase origin master && git push; then
                echo "푸시 성공 (시도 $attempt)"
                exit 0
              fi
              echo "::warning::푸시 실패 ($attempt/3), 10초 후 재시도"
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            echo "::error title=데이터 푸시 실패::rebase 후 3회 재시도했지만 push가 모두 실패했습니다."
            exit 1
          fi
