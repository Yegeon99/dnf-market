name: 심야 분석·브리핑

on:
  schedule:
    # KST 03:00 = UTC 18:00 — 심야 슬롯: 수집→탐지→해석→브리핑 통합 실행
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 셋업
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests anthropic

      - name: 통합 실행 (수집→집계→탐지→해석→브리핑)
        env:
          NEOPLE_API_KEY: ${{ secrets.NEOPLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/run_daily.py

      - name: 데이터 커밋 (data/ 경로 한정)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "[data] 심야 분석·브리핑 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase origin master
            git push
          fi
